services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${VOICE_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: mfc-voice-web:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VOICE_DB_PATH: /data/db/call-analytics.sqlite3
    volumes:
      - ./.data:/data/db
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      asr-api:
        condition: service_healthy
      diarization-api:
        condition: service_healthy
      emotion-api:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: mfc-voice-web:latest
    restart: unless-stopped
    command: python -m call_analytics.worker_app
    env_file:
      - .env
    environment:
      VOICE_DB_PATH: /data/db/call-analytics.sqlite3
      VOICE_STAGING_DIR: /data/staging
      VOICE_ASR_URL: http://asr-api:8100
      VOICE_DIARIZATION_URL: http://diarization-api:8100
      VOICE_EMOTION_URL: http://emotion-api:8100
      VOICE_RABBITMQ_URL: amqp://guest:guest@rabbitmq/
      VOICE_RABBITMQ_QUEUE: ${VOICE_RABBITMQ_QUEUE:-voice.recordings}
      VOICE_CONTAINER_STAGING_DIR: /data/staging
      VOICE_QWEN_BASE_URL: ${VOICE_QWEN_BASE_URL:-http://host.docker.internal:8000/v1}
      VOICE_QWEN_MODEL: ${VOICE_QWEN_MODEL:-qwen3.6-35b}
      VOICE_WORKER_IDLE_SLEEP_SECONDS: ${VOICE_WORKER_IDLE_SLEEP_SECONDS:-1}
      VOICE_WORKER_WATCHDOG_INTERVAL_SECONDS: ${VOICE_WORKER_WATCHDOG_INTERVAL_SECONDS:-60}
      VOICE_WORKER_STALE_AFTER_SECONDS: ${VOICE_WORKER_STALE_AFTER_SECONDS:-1800}
      VOICE_WORKER_STALE_MAX_ATTEMPTS: ${VOICE_WORKER_STALE_MAX_ATTEMPTS:-8}
      VOICE_WORKER_PROCESSING_TIMEOUT_SECONDS: ${VOICE_WORKER_PROCESSING_TIMEOUT_SECONDS:-1800}
    volumes:
      - ./.data:/data/db
      - ./.staging:/data/staging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      asr-api:
        condition: service_healthy
      diarization-api:
        condition: service_healthy
      emotion-api:
        condition: service_healthy

  grandstream-sync:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: mfc-voice-web:latest
    restart: unless-stopped
    command: python -m call_analytics.sync_app
    env_file:
      - .env
    environment:
      VOICE_DB_PATH: /data/db/call-analytics.sqlite3
      VOICE_STAGING_DIR: /data/staging
      VOICE_CONTAINER_STAGING_DIR: /data/staging
      VOICE_RABBITMQ_URL: amqp://guest:guest@rabbitmq/
      VOICE_RABBITMQ_QUEUE: ${VOICE_RABBITMQ_QUEUE:-voice.recordings}
      VOICE_GRANDSTREAM_URL: ${VOICE_GRANDSTREAM_URL:-https://grandstream253.mfcl.mfclnr.ru/api}
      VOICE_GRANDSTREAM_USER: ${VOICE_GRANDSTREAM_USER:-ranhigs}
      VOICE_GRANDSTREAM_PASSWORD: ${VOICE_GRANDSTREAM_PASSWORD:-}
      VOICE_GRANDSTREAM_QUEUE: ${VOICE_GRANDSTREAM_QUEUE:-6500}
      VOICE_GRANDSTREAM_QUEUE_NAME: ${VOICE_GRANDSTREAM_QUEUE_NAME:-Call_center}
      VOICE_GRANDSTREAM_CA_FILE: /usr/local/share/ca-certificates/mfcRootCA.crt
      VOICE_GRANDSTREAM_API_TIMEOUT_SECONDS: ${VOICE_GRANDSTREAM_API_TIMEOUT_SECONDS:-120}
      VOICE_GRANDSTREAM_DOWNLOAD_TIMEOUT_SECONDS: ${VOICE_GRANDSTREAM_DOWNLOAD_TIMEOUT_SECONDS:-900}
      VOICE_SYNC_TIME: ${VOICE_SYNC_TIME:-02:00}
      VOICE_SYNC_BATCH_LIMIT: ${VOICE_SYNC_BATCH_LIMIT:-3000}
      VOICE_SYNC_ENABLED: ${VOICE_SYNC_ENABLED:-no}
      VOICE_SYNC_RUN_ON_START: ${VOICE_SYNC_RUN_ON_START:-no}
    volumes:
      - ./.data:/data/db
      - ./.staging:/data/staging
    depends_on:
      rabbitmq:
        condition: service_healthy

  qwen-api:
    image: vllm/vllm-openai:${VOICE_QWEN_VLLM_TAG:-latest}
    profiles:
      - qwen
    restart: unless-stopped
    ipc: host
    shm_size: "16gb"
    env_file:
      - .env
    environment:
      HF_HOME: /models/huggingface
      HUGGINGFACE_HUB_CACHE: /models/huggingface/hub
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      HF_HUB_DISABLE_XET: "1"
      NVIDIA_VISIBLE_DEVICES: "${QWEN_NVIDIA_VISIBLE_DEVICES:-0,1}"
      NCCL_P2P_DISABLE: "1"
      VLLM_LOGGING_LEVEL: ${VOICE_QWEN_LOGGING_LEVEL:-INFO}
    volumes:
      - ${VOICE_QWEN_HF_CACHE:-./model-cache/huggingface}:/root/.cache/huggingface
    expose:
      - "8000"
    command:
      - --model
      - ${VOICE_QWEN_MODEL_ID:-cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit}
      - --served-model-name
      - ${VOICE_QWEN_MODEL:-qwen3.6-35b}
      - --tensor-parallel-size
      - "${VOICE_QWEN_TENSOR_PARALLEL_SIZE:-2}"
      - --gpu-memory-utilization
      - "${VOICE_QWEN_GPU_MEMORY_UTILIZATION:-0.76}"
      - --max-model-len
      - "${VOICE_QWEN_MAX_MODEL_LEN:-131072}"
      - --dtype
      - auto
      - --trust-remote-code
      - --reasoning-parser
      - qwen3
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1"]
              capabilities: [gpu]

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    expose:
      - "5672"
      - "15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  asr-api:
    build:
      context: ./docker/voice-model-api
    image: mfc-voice-model-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MODEL_SERVICE: asr
      MODEL_DEVICE: ${MODEL_DEVICE:-cuda}
      ASR_MODEL: ${ASR_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}
      NVIDIA_VISIBLE_DEVICES: "${ASR_NVIDIA_VISIBLE_DEVICES:-${NVIDIA_VISIBLE_DEVICES:-0}}"
      HF_HOME: /models/huggingface
      HUGGINGFACE_HUB_CACHE: /models/huggingface/hub
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - ./.staging:/data/staging:ro
      - ./model-cache:/models
    expose:
      - "8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ASR_NVIDIA_VISIBLE_DEVICES:-0}"]
              capabilities: [gpu]

  diarization-api:
    build:
      context: ./docker/voice-model-api
    image: mfc-voice-model-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MODEL_SERVICE: diarization
      MODEL_DEVICE: ${MODEL_DEVICE:-cuda}
      DIARIZATION_MODEL: ${DIARIZATION_MODEL:-pyannote/speaker-diarization-community-1}
      NVIDIA_VISIBLE_DEVICES: "${DIARIZATION_NVIDIA_VISIBLE_DEVICES:-${NVIDIA_VISIBLE_DEVICES:-0}}"
      HF_HOME: /models/huggingface
      HUGGINGFACE_HUB_CACHE: /models/huggingface/hub
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - ./.staging:/data/staging:ro
      - ./model-cache:/models
    expose:
      - "8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${DIARIZATION_NVIDIA_VISIBLE_DEVICES:-0}"]
              capabilities: [gpu]

  emotion-api:
    build:
      context: ./docker/voice-model-api
    image: mfc-voice-model-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MODEL_SERVICE: emotion
      MODEL_DEVICE: ${MODEL_DEVICE:-cuda}
      SER_MODEL: ${SER_MODEL:-xbgoose/hubert-large-speech-emotion-recognition-russian-dusha-finetuned}
      NVIDIA_VISIBLE_DEVICES: "${EMOTION_NVIDIA_VISIBLE_DEVICES:-${NVIDIA_VISIBLE_DEVICES:-0}}"
      HF_HOME: /models/huggingface
      HUGGINGFACE_HUB_CACHE: /models/huggingface/hub
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - ./.staging:/data/staging:ro
      - ./model-cache:/models
    expose:
      - "8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${EMOTION_NVIDIA_VISIBLE_DEVICES:-0}"]
              capabilities: [gpu]
